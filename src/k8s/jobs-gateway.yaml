apiVersion: v1
kind: Namespace
metadata:
  name: exchanges
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-gateway
  namespace: exchanges
  labels:
    app: jobs-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobs-gateway
  template:
    metadata:
      labels:
        app: jobs-gateway
    spec:
      containers:
      - name: jobs-gateway
        imagePullPolicy: Always
        image: 100.114.179.122:31280/agents/xchange-jobs-gateway:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URL
          value: "mongodb://registry-0.registries.svc.cluster.local:27017"
        - name: GATEWAY_DB_NAME
          value: "xchange_gateway"
        - name: HEALTH_CHECK_INTERVAL
          value: "30"
        - name: PROXY_READ_TIMEOUT
          value: "300"
        - name: DISCOVERY_WORKERS
          value: "8"
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-gateway-svc
  namespace: exchanges
  labels:
    app: jobs-gateway
spec:
  selector:
    app: jobs-gateway
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30741
  type: NodePort
